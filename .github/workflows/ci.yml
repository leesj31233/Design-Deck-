name: Design Deck CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: design-deck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Unit and storage tests
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Reader browser tests
        run: npm run test:e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperflow-browser-results
          path: |
            playwright-report/
            test-results/
